<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Digital Library</title>

    <link rel="stylesheet"
          href="../css/register.css">

</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            📚
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to Digital Library
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    placeholder="Enter username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter password"
                >

            </div>


            <button type="button"
                    class="forgot-password"
                    onclick="forgotPassword()">
                Forgot password?
            </button>


            <p id="message" class="message"></p>


            <button type="submit"
                    id="loginButton"
                    class="btn primary-btn">
                Login
            </button>


            <button type="button"
                    class="btn reset-btn"
                    onclick="resetForm()">
                Reset
            </button>

        </form>

        <div id="forgotPasswordModal"
             class="modal hidden"
             aria-hidden="true">

            <div class="modal-content">

                <button type="button"
                        class="close-modal"
                        aria-label="Close recovery form"
                        onclick="closeForgotPasswordModal()">
                    ×
                </button>

                <h2>Reset Password</h2>

                <p class="modal-text">
                    Password recovery is not available in this demo. Please contact the library administrator.
                </p>

            </div>

        </div>


        <p class="register-text">
            Don't have an account?
            <a href="register.html">
                Register
            </a>
        </p>


        <a href="../index.html"
           class="back-link">
            ← Back to Welcome
        </a>


    </div>


    <script src="../js/login.js"></script>

</body>
</html>
